name: Billing recommendation checkout (Stripe live) e2e

# Runs tests/e2e/billingRecommendationCheckoutStripe.spec.ts against a real
# Stripe test-mode account on every PR/push when the billing creds are
# configured. Skips cleanly (job passes) on forks / unconfigured repos.
# Failure artifacts: .ci-logs/ (spec log + tenant failure screenshot at
# .ci-logs/screenshots/billing-recommendation-checkout-stripe-tenant-failure.png).

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

concurrency:
  group: billing-recommendation-checkout-stripe-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-recommendation-checkout-stripe-e2e:
    name: Billing recommendation checkout (Stripe live) e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voiceaihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiceaihub_test
      ADMIN_EMAIL: admin@voiceaihub.dev
      ADMIN_PASSWORD: test-password-123
      E2E_ADMIN_EMAIL: admin@voiceaihub.dev
      E2E_ADMIN_PASSWORD: test-password-123
      E2E_BASE_URL: http://localhost:5000
      E2E_ARTIFACT_DIR: .ci-logs/screenshots
      ADMIN_API_PORT: "3002"
      VOICE_GATEWAY_PORT: "3001"
      DISABLE_PHI_LOGGING: "true"
      # Stripe secrets are injected per-step (gate / boot / spec) rather
      # than at job scope so dependency installs and unrelated tooling
      # never see them.

    steps:
      # Resolves to `true` only when both required Stripe secrets are
      # configured AND the secret key is a test-mode key. Hard-errors on
      # a non-test key so live creds wired up by mistake fail fast.
      - name: Determine whether to run the live Stripe spec
        id: gate
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
        run: |
          run_spec="false"
          reason=""
          if [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${STRIPE_PRICE_ENTERPRISE_MONTHLY}" ]; then
            reason="STRIPE_SECRET_KEY and/or STRIPE_PRICE_ENTERPRISE_MONTHLY is not configured"
          elif [ "${STRIPE_SECRET_KEY#sk_test_}" = "${STRIPE_SECRET_KEY}" ]; then
            echo "::error::STRIPE_SECRET_KEY is configured but is not a test-mode key (sk_test_…). Refusing to run live Stripe e2e against a non-test key."
            exit 1
          else
            run_spec="true"
          fi
          echo "run_spec=${run_spec}" >> "$GITHUB_OUTPUT"
          if [ "${run_spec}" = "true" ]; then
            echo "::notice::Live Stripe billing creds detected — running billingRecommendationCheckoutStripe.spec.ts."
          else
            echo "::notice::Skipping billingRecommendationCheckoutStripe.spec.ts: ${reason}. Configure STRIPE_SECRET_KEY (sk_test_…) and STRIPE_PRICE_ENTERPRISE_MONTHLY in repo secrets to enable this check."
          fi

      - name: Check out repository
        if: steps.gate.outputs.run_spec == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.gate.outputs.run_spec == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        if: steps.gate.outputs.run_spec == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install client-app dependencies
        if: steps.gate.outputs.run_spec == 'true'
        working-directory: client-app
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium browser
        if: steps.gate.outputs.run_spec == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        if: steps.gate.outputs.run_spec == 'true'
        run: npx tsx scripts/run-migrations.ts

      - name: Seed admin user
        if: steps.gate.outputs.run_spec == 'true'
        run: npx tsx scripts/seed-admin.ts

      - name: Boot Platform Dev stack
        if: steps.gate.outputs.run_spec == 'true'
        # Stripe creds are required here because the dev stack's
        # /api/billing/checkout endpoint calls Stripe to create the
        # session the spec inspects.
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
        run: |
          mkdir -p .ci-logs/screenshots
          nohup bash scripts/start-platform-dev.sh > .ci-logs/platform-dev.log 2>&1 &
          echo $! > .ci-logs/platform.pid

      - name: Wait for vite (5000) and admin API (3002) to be healthy
        if: steps.gate.outputs.run_spec == 'true'
        run: |
          set +e
          for i in $(seq 1 90); do
            curl -sSfo /dev/null http://localhost:5000/ \
              && curl -sSfo /dev/null http://localhost:3002/health \
              && echo "Both services up after ${i}s" \
              && exit 0
            sleep 2
          done
          echo "::error::Platform Dev did not come up within 180s"
          echo "----- platform-dev.log (last 200 lines) -----"
          tail -n 200 .ci-logs/platform-dev.log || true
          exit 1

      - name: Run billing recommendation checkout (Stripe live) e2e
        id: spec
        if: steps.gate.outputs.run_spec == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
        run: |
          set -o pipefail
          npm run test:e2e:billing-recommendation-checkout-stripe 2>&1 \
            | tee .ci-logs/billing-recommendation-checkout-stripe.log

      - name: Capture Platform Dev logs
        if: always() && steps.gate.outputs.run_spec == 'true'
        run: |
          if [ -f .ci-logs/platform-dev.log ]; then
            echo "----- platform-dev.log (last 500 lines) -----"
            tail -n 500 .ci-logs/platform-dev.log || true
          fi

      - name: Upload Platform Dev + spec logs and screenshots on failure
        if: failure() && steps.gate.outputs.run_spec == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: billing-recommendation-checkout-stripe-e2e-artifacts
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Platform Dev
        if: always() && steps.gate.outputs.run_spec == 'true'
        run: |
          if [ -f .ci-logs/platform.pid ]; then
            kill "$(cat .ci-logs/platform.pid)" 2>/dev/null || true
          fi
          pkill -f "tsx server/admin-api" 2>/dev/null || true
          pkill -f "tsx server/voice-gateway" 2>/dev/null || true
          pkill -f "vite --config client-app" 2>/dev/null || true
          exit 0
