name: Admin pages e2e

# Boots the Platform Dev stack once per CI run and walks the highest-traffic
# admin-side regression specs back-to-back against the same server. The
# original Sales Inbox-only job (`sales-inbox-e2e.yml`) was renamed to this
# file in task #917 so additional admin-page regressions can be added
# without per-spec server restart cost.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

concurrency:
  group: admin-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    name: Admin pages e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voiceaihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiceaihub_test
      ADMIN_EMAIL: admin@voiceaihub.dev
      ADMIN_PASSWORD: test-password-123
      E2E_ADMIN_EMAIL: admin@voiceaihub.dev
      E2E_ADMIN_PASSWORD: test-password-123
      E2E_BASE_URL: http://localhost:5000
      # Both specs honour E2E_ARTIFACT_DIR for failure screenshots; pinning
      # it inside .ci-logs/ means the per-job upload step picks them up.
      E2E_ARTIFACT_DIR: .ci-logs/screenshots
      ADMIN_API_PORT: "3002"
      VOICE_GATEWAY_PORT: "3001"
      DISABLE_PHI_LOGGING: "true"
      # Bump per-tenant live-stream/SSE cap so specs that re-mount
      # Dashboard many times in a 60s window (e.g. the agent-builder
      # template-localization spec) don't false-trip the 429 path.
      # Production keeps the conservative default of 20.
      TENANT_LIVE_STREAM_CAP: "500"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install client-app dependencies
        working-directory: client-app
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npx tsx scripts/run-migrations.ts

      - name: Seed admin user
        run: npx tsx scripts/seed-admin.ts

      # Task #1159: seed dispatch jobs, SMS conversations and call/QA
      # rows so the tenant-status-badge axe audit actually exercises
      # `/dispatch`, `/sms-inbox` and `/quality` (those pages only
      # render their status pills inside per-row data, so they no-op
      # under the admin-only seed without these fixtures).
      - name: Seed status-badge fixtures (dispatch / SMS / quality)
        run: npx tsx scripts/seed-status-badge-fixtures.ts

      - name: Boot Platform Dev stack
        run: |
          mkdir -p .ci-logs/screenshots
          nohup bash scripts/start-platform-dev.sh > .ci-logs/platform-dev.log 2>&1 &
          echo $! > .ci-logs/platform.pid

      - name: Wait for vite (5000) and admin API (3002) to be healthy
        run: |
          set +e
          for i in $(seq 1 90); do
            curl -sSfo /dev/null http://localhost:5000/ \
              && curl -sSfo /dev/null http://localhost:3002/health \
              && echo "Both services up after ${i}s" \
              && exit 0
            sleep 2
          done
          echo "::error::Platform Dev did not come up within 180s"
          echo "----- platform-dev.log (last 200 lines) -----"
          tail -n 200 .ci-logs/platform-dev.log || true
          exit 1

      # ─── Specs ───────────────────────────────────────────────────────────
      # Each spec runs against the already-booted server (no per-spec restart
      # cost). Each step pipes stdout/stderr to its own log file under
      # .ci-logs/ so triagers can pull just the failing spec's transcript
      # from the uploaded artifact. `set -o pipefail` ensures the step still
      # fails if the spec exits non-zero even though we're piping to tee.
      # `continue-on-error: true` lets later specs run regardless, and the
      # final step asserts that all specs passed before the job succeeds.

      - name: Run Sales Inbox filters e2e
        id: spec-sales-inbox-filters
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:sales-inbox-filters 2>&1 | tee .ci-logs/sales-inbox-filters.log

      - name: Run Admin pages smoke e2e
        id: spec-admin-pages-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:admin-pages-smoke 2>&1 | tee .ci-logs/admin-pages-smoke.log

      - name: Run Tenant pages smoke e2e
        id: spec-tenant-pages-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:tenant-pages-smoke 2>&1 | tee .ci-logs/tenant-pages-smoke.log

      - name: Run Ops pages smoke e2e
        id: spec-ops-pages-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:ops-pages-smoke 2>&1 | tee .ci-logs/ops-pages-smoke.log

      - name: Run Brand prominence smoke e2e (QVO/4)
        id: spec-brand-prominence-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:brand-prominence-smoke 2>&1 | tee .ci-logs/brand-prominence-smoke.log

      - name: Run Onboarding dismiss/restart e2e
        id: spec-onboarding-dismiss-restart
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-dismiss-restart 2>&1 | tee .ci-logs/onboarding-dismiss-restart.log

      - name: Run Onboarding resume-saved-step e2e
        id: spec-onboarding-resume-saved-step
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-resume-saved-step 2>&1 | tee .ci-logs/onboarding-resume-saved-step.log

      - name: Run Onboarding progress-dots back-nav e2e
        id: spec-onboarding-progress-dots-back-nav
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-progress-dots-back-nav 2>&1 | tee .ci-logs/onboarding-progress-dots-back-nav.log

      - name: Run Onboarding progress-dots no-skip-ahead e2e
        id: spec-onboarding-progress-dots-no-skip-ahead
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-progress-dots-no-skip-ahead 2>&1 | tee .ci-logs/onboarding-progress-dots-no-skip-ahead.log

      - name: Run Onboarding template-updates-agent e2e
        id: spec-onboarding-template-updates-agent
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-template-updates-agent 2>&1 | tee .ci-logs/onboarding-template-updates-agent.log

      - name: Run Onboarding template-update failure-surfaces e2e
        id: spec-onboarding-template-update-failure-surfaces
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:onboarding-template-update-failure-surfaces 2>&1 | tee .ci-logs/onboarding-template-update-failure-surfaces.log

      - name: Run Tenant status-badge axe e2e
        id: spec-tenant-status-badge-axe
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:tenant-status-badge-axe 2>&1 | tee .ci-logs/tenant-status-badge-axe.log

      - name: Run Agent Builder starter-templates e2e
        id: spec-agent-builder-starter-templates
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:agent-builder-starter-templates 2>&1 | tee .ci-logs/agent-builder-starter-templates.log

      - name: Run Agent Builder template-localization e2e
        id: spec-agent-builder-template-localization
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:agent-builder-template-localization 2>&1 | tee .ci-logs/agent-builder-template-localization.log

      - name: Run Tenant visual smoke e2e
        id: spec-tenant-visual-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:tenant-visual-smoke 2>&1 | tee .ci-logs/tenant-visual-smoke.log

      - name: Run Billing downgrade-credit copy e2e
        id: spec-billing-downgrade-credit-copy
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:billing-downgrade-credit-copy 2>&1 | tee .ci-logs/billing-downgrade-credit-copy.log

      - name: Run Billing annual-switch success-banner stacked discounts e2e
        id: spec-billing-annual-switch-success-stacked-discounts
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:billing-annual-switch-success-stacked-discounts 2>&1 \
            | tee .ci-logs/billing-annual-switch-success-stacked-discounts.log

      - name: Run Billing annual-switch success-banner legacy discount e2e
        id: spec-billing-annual-switch-success-legacy-discount
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:billing-annual-switch-success-legacy-discount 2>&1 \
            | tee .ci-logs/billing-annual-switch-success-legacy-discount.log

      - name: Run Billing tier-upgrade success-banner copy e2e
        id: spec-billing-tier-upgrade-success-banner-copy
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:billing-tier-upgrade-success-banner-copy 2>&1 \
            | tee .ci-logs/billing-tier-upgrade-success-banner-copy.log

      - name: Run Billing tier-upgrade success-banner legacy discount e2e
        id: spec-billing-tier-upgrade-success-legacy-discount
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e:billing-tier-upgrade-success-legacy-discount 2>&1 \
            | tee .ci-logs/billing-tier-upgrade-success-legacy-discount.log

      - name: Capture Platform Dev logs
        if: always()
        run: |
          if [ -f .ci-logs/platform-dev.log ]; then
            echo "----- platform-dev.log (last 500 lines) -----"
            tail -n 500 .ci-logs/platform-dev.log || true
          fi

      - name: Upload Platform Dev + spec logs and screenshots on failure
        if: failure() || steps.spec-sales-inbox-filters.outcome == 'failure' || steps.spec-admin-pages-smoke.outcome == 'failure' || steps.spec-tenant-pages-smoke.outcome == 'failure' || steps.spec-ops-pages-smoke.outcome == 'failure' || steps.spec-brand-prominence-smoke.outcome == 'failure' || steps.spec-onboarding-dismiss-restart.outcome == 'failure' || steps.spec-onboarding-resume-saved-step.outcome == 'failure' || steps.spec-onboarding-progress-dots-back-nav.outcome == 'failure' || steps.spec-onboarding-progress-dots-no-skip-ahead.outcome == 'failure' || steps.spec-onboarding-template-updates-agent.outcome == 'failure' || steps.spec-onboarding-template-update-failure-surfaces.outcome == 'failure' || steps.spec-tenant-status-badge-axe.outcome == 'failure' || steps.spec-agent-builder-starter-templates.outcome == 'failure' || steps.spec-agent-builder-template-localization.outcome == 'failure' || steps.spec-tenant-visual-smoke.outcome == 'failure' || steps.spec-billing-downgrade-credit-copy.outcome == 'failure' || steps.spec-billing-annual-switch-success-stacked-discounts.outcome == 'failure' || steps.spec-billing-annual-switch-success-legacy-discount.outcome == 'failure' || steps.spec-billing-tier-upgrade-success-banner-copy.outcome == 'failure' || steps.spec-billing-tier-upgrade-success-legacy-discount.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-artifacts
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      # Always upload the tenant visual smoke screenshots so reviewers can
      # eyeball light + dark renders on every PR — not just on failure. The
      # spec writes 10 PNGs (5 pages × 2 themes) into .ci-logs/screenshots/
      # using the `tenant-visual-smoke-*` filename prefix.
      - name: Upload tenant visual smoke screenshots
        if: always() && steps.spec-tenant-visual-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tenant-visual-smoke-screenshots
          path: .ci-logs/screenshots/tenant-visual-smoke-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down Platform Dev
        if: always()
        run: |
          if [ -f .ci-logs/platform.pid ]; then
            kill "$(cat .ci-logs/platform.pid)" 2>/dev/null || true
          fi
          pkill -f "tsx server/admin-api" 2>/dev/null || true
          pkill -f "tsx server/voice-gateway" 2>/dev/null || true
          pkill -f "vite --config client-app" 2>/dev/null || true
          exit 0

      # Aggregate gate: this is the step that actually fails the job when any
      # spec failed. Without it, `continue-on-error: true` above would make
      # the whole job pass even though specs broke.
      - name: Fail job if any spec failed
        if: steps.spec-sales-inbox-filters.outcome == 'failure' || steps.spec-admin-pages-smoke.outcome == 'failure' || steps.spec-tenant-pages-smoke.outcome == 'failure' || steps.spec-ops-pages-smoke.outcome == 'failure' || steps.spec-brand-prominence-smoke.outcome == 'failure' || steps.spec-onboarding-dismiss-restart.outcome == 'failure' || steps.spec-onboarding-resume-saved-step.outcome == 'failure' || steps.spec-onboarding-progress-dots-back-nav.outcome == 'failure' || steps.spec-onboarding-progress-dots-no-skip-ahead.outcome == 'failure' || steps.spec-onboarding-template-updates-agent.outcome == 'failure' || steps.spec-onboarding-template-update-failure-surfaces.outcome == 'failure' || steps.spec-tenant-status-badge-axe.outcome == 'failure' || steps.spec-agent-builder-starter-templates.outcome == 'failure' || steps.spec-agent-builder-template-localization.outcome == 'failure' || steps.spec-tenant-visual-smoke.outcome == 'failure' || steps.spec-billing-downgrade-credit-copy.outcome == 'failure' || steps.spec-billing-annual-switch-success-stacked-discounts.outcome == 'failure' || steps.spec-billing-annual-switch-success-legacy-discount.outcome == 'failure' || steps.spec-billing-tier-upgrade-success-banner-copy.outcome == 'failure' || steps.spec-billing-tier-upgrade-success-legacy-discount.outcome == 'failure'
        run: |
          echo "::error::One or more admin e2e specs failed:"
          echo "  sales-inbox-filters:                ${{ steps.spec-sales-inbox-filters.outcome }}"
          echo "  admin-pages-smoke:                  ${{ steps.spec-admin-pages-smoke.outcome }}"
          echo "  tenant-pages-smoke:                 ${{ steps.spec-tenant-pages-smoke.outcome }}"
          echo "  ops-pages-smoke:                    ${{ steps.spec-ops-pages-smoke.outcome }}"
          echo "  brand-prominence-smoke:             ${{ steps.spec-brand-prominence-smoke.outcome }}"
          echo "  onboarding-dismiss-restart:         ${{ steps.spec-onboarding-dismiss-restart.outcome }}"
          echo "  onboarding-resume-saved-step:       ${{ steps.spec-onboarding-resume-saved-step.outcome }}"
          echo "  onboarding-progress-dots-back-nav:  ${{ steps.spec-onboarding-progress-dots-back-nav.outcome }}"
          echo "  onboarding-progress-dots-no-skip-ahead:${{ steps.spec-onboarding-progress-dots-no-skip-ahead.outcome }}"
          echo "  onboarding-template-updates-agent:  ${{ steps.spec-onboarding-template-updates-agent.outcome }}"
          echo "  onboarding-template-update-failure-surfaces:${{ steps.spec-onboarding-template-update-failure-surfaces.outcome }}"
          echo "  tenant-status-badge-axe:            ${{ steps.spec-tenant-status-badge-axe.outcome }}"
          echo "  agent-builder-starter-templates:    ${{ steps.spec-agent-builder-starter-templates.outcome }}"
          echo "  agent-builder-template-localization:${{ steps.spec-agent-builder-template-localization.outcome }}"
          echo "  tenant-visual-smoke:                ${{ steps.spec-tenant-visual-smoke.outcome }}"
          echo "  billing-downgrade-credit-copy:      ${{ steps.spec-billing-downgrade-credit-copy.outcome }}"
          echo "  billing-annual-switch-success-stacked-discounts:${{ steps.spec-billing-annual-switch-success-stacked-discounts.outcome }}"
          echo "  billing-annual-switch-success-legacy-discount:${{ steps.spec-billing-annual-switch-success-legacy-discount.outcome }}"
          echo "  billing-tier-upgrade-success-banner-copy:${{ steps.spec-billing-tier-upgrade-success-banner-copy.outcome }}"
          echo "  billing-tier-upgrade-success-legacy-discount:${{ steps.spec-billing-tier-upgrade-success-legacy-discount.outcome }}"
          exit 1
