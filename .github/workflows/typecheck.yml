name: Typecheck

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-app-typecheck:
    name: client-app tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (root)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install dependencies (client-app)
        working-directory: client-app
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run client-app typecheck
        run: npm run typecheck:client

      - name: Run i18n key sync check
        run: npm run check:i18n-keys

      - name: Run sitemap coverage check
        run: npm run check:sitemap-coverage
