<!DOCTYPE html>
<html lang="en" data-i18n-managed="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QVO — Quality Voice Operations</title>
    <meta name="description" content="QVO is the voice operations hub for small businesses. After-hours call handling, scheduling, routing, and visibility in one system." />
    <link rel="icon" type="image/png" href="/brand/logo-symbol-harbor.png" />
    <link rel="apple-touch-icon" href="/brand/logo-symbol-harbor.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand fonts per qvo-brand-kit/README.md: Sora display, Manrope body, JetBrains Mono mono -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Static hreflang fallbacks for the home page. These point crawlers that
      do not execute JavaScript at every supported locale variant of `/`. The
      <SEO> component sweeps every alternate hreflang tag on mount (matched
      by `data-seo-hreflang-static` for these and `data-seo-hreflang` for
      its own runtime tags) and re-emits per-page alternates for the active
      route, so JS-enabled visitors never see both sets at once.
    -->
    <link rel="alternate" hreflang="en" href="/" data-seo-hreflang-static="true" />
    <link rel="alternate" hreflang="es" href="/es" data-seo-hreflang-static="true" />
    <link rel="alternate" hreflang="pt-BR" href="/pt-BR" data-seo-hreflang-static="true" />
    <link rel="alternate" hreflang="fr" href="/fr" data-seo-hreflang-static="true" />
    <link rel="alternate" hreflang="de" href="/de" data-seo-hreflang-static="true" />
    <link rel="alternate" hreflang="x-default" href="/" data-seo-hreflang-static="true" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.public.tsx"></script>
  </body>
</html>
