<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="console.cloud.google.com/apis/credentials">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">console.cloud.google.com/apis/credentials</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#1a73e8"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">OAuth Client Created</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <circle cx="60" cy="170" r="20" fill="#dcfce7"/>
    <path d="M52 170 L58 176 L70 164" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="92" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">OAuth client created</text>
    <text x="92" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Copy your credentials below — the client secret is only shown once.</text>
    <text x="36" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Client ID</text>
    <rect x="36" y="230" width="600" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="252" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">417209384521-abcdef0123456789ghijklm.apps.googleusercontent.com</text>
    <rect x="648" y="230" width="110" height="34" rx="6" fill="#475569"/>
    <text x="703" y="251" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⧉ COPY</text>
    <text x="36" y="292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Client secret</text>
    <rect x="36" y="300" width="600" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="322" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">GOCSPX-aBcDeFgHiJ_kLmNoPqRsTuVwXyZ12</text>
    <rect x="648" y="300" width="110" height="34" rx="6" fill="#475569"/>
    <text x="703" y="321" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⧉ COPY</text>
    <g>
      <rect x="36" y="380" width="420" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="380"><tspan x="48" dy="18">Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET</tspan><tspan x="48" dy="16">on the QVO server with these values</tspan></text>
    </g>
    <line x1="460" y1="410" x2="760" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="460" width="120" height="36" rx="6" fill="#1a73e8"/>
    <text x="760" y="482" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">OK</text>
    
  </svg>