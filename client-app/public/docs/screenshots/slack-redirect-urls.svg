<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="api.slack.com/apps/A12345/oauth">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">api.slack.com/apps/A12345/oauth</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#4a154b"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO · OAuth & Permissions</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Redirect URLs</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">URL where users are redirected after they authorize the app. Must use HTTPS.</text>
    <text x="36" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">URL</text>
    <rect x="36" y="222" width="720" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="244" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">https://app.qvo.ai/api/connectors/oauth/slack/callback</text>
    <rect x="766" y="222" width="100" height="34" rx="6" fill="#dc2626"/>
    <text x="816" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Remove</text>
    <rect x="36" y="290" width="170" height="34" rx="6" fill="#ffffff" stroke="#475569"/>
    <text x="121" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">+ Add New Redirect URL</text>
    <rect x="730" y="410" width="130" height="36" rx="6" fill="#007a5a"/>
    <text x="795" y="432" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Save URLs</text>
    <g>
      <rect x="36" y="350" width="320" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="350"><tspan x="48" dy="18">Click Save URLs after adding —</tspan><tspan x="48" dy="16">the URL is not active until saved</tspan></text>
    </g>
    <line x1="200" y1="410" x2="730" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>