<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="developer.intuit.com/app/developer/myapps/scopes">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">developer.intuit.com/app/developer/myapps/scopes</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0077c5"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO Voice Agent · Scopes</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">OAuth scopes</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pick the API surfaces this app may access.</text>
    <rect x="36" y="218" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 226 L43 230 L49 222" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="230" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">com.intuit.quickbooks.accounting — Customers, Items, Invoices</text>
    <text x="60" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Required — QVO writes Customers and Invoices.</text>
    <rect x="36" y="286" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="298" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">com.intuit.quickbooks.payment — Payments</text>
    <rect x="36" y="318" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="330" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">openid</text>
    <rect x="36" y="350" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="362" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">profile</text>
    <rect x="36" y="382" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="394" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">email</text>
    <rect x="740" y="440" width="120" height="36" rx="6" fill="#0077c5"/>
    <text x="800" y="462" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Save</text>
    <g>
      <rect x="460" y="220" width="280" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="220"><tspan x="472" dy="18">This is the only scope QVO needs</tspan></text>
    </g>
    <line x1="460" y1="240" x2="380" y2="226" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>