    <path d="M59 262 L63 266 L69 258" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="266" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">offline_access — Maintain access to data</text>
