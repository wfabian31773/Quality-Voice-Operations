      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="420"><tspan x="472" dy="18">Click Grant admin consent so users</tspan><tspan x="472" dy="16">do not have to approve each scope</tspan></text>
