    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Microsoft Graph · Delegated</text>
    <rect x="36" y="200" width="828" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="222" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 230 L63 234 L69 226" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="234" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Calendars.ReadWrite — Read/write user calendars</text>
