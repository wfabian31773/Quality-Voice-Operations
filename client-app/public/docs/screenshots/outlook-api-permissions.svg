    <path d="M59 294 L63 298 L69 290" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="298" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">openid — Sign users in</text>
    <rect x="56" y="318" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 326 L63 330 L69 322" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="330" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">profile — View user basic profile</text>
