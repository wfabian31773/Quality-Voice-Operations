<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="appcenter.intuit.com/connect/oauth2">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">appcenter.intuit.com/connect/oauth2</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0077c5"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Intuit · Authorize QVO</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <rect x="240" y="160" width="420" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="450" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Authorize QVO Voice Agent</text>
    <text x="450" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">to access your QuickBooks data.</text>
    <text x="270" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Choose a company</text>
    <rect x="270" y="270" width="360" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <circle cx="288" cy="290" r="8" fill="#2ca01c"/>
    <text x="306" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Acme Plumbing — Realm 4620816374521098</text>
    <rect x="270" y="318" width="360" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="288" cy="338" r="8" fill="#2ca01c"/>
    <text x="306" y="343" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Acme Sandbox — Realm 4620816387654321</text>
    <rect x="270" y="376" width="170" height="40" rx="6" fill="#0077c5"/>
    <text x="355" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
    <rect x="450" y="376" width="170" height="40" rx="6" fill="#94a3b8"/>
    <text x="535" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Cancel</text>
    <g>
      <rect x="36" y="360" width="200" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="360"><tspan x="48" dy="18">Realm ID is captured by QVO</tspan><tspan x="48" dy="16">automatically from the callback</tspan></text>
    </g>
    <line x1="240" y1="380" x2="270" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>