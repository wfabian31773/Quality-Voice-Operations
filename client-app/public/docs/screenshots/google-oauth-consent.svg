<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="console.cloud.google.com/apis/credentials/consent">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">console.cloud.google.com/apis/credentials/consent</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#1a73e8"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Google Cloud · OAuth consent screen</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">OAuth consent screen</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Choose how to expose your app to users.</text>
    <text x="36" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">User Type</text>
    <circle cx="50" cy="240" r="8" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="50" cy="240" r="4" fill="#1a73e8"/>
    <text x="68" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">Internal</text>
    <text x="68" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Only available to users in your Workspace org · No verification required</text>
    <circle cx="50" cy="290" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="68" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#0f172a">External</text>
    <text x="68" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Any Google account · Verification needed for production</text>
    <text x="36" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Scopes</text>
    <rect x="36" y="370" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 378 L43 382 L49 374" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="382" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">.../auth/calendar</text>
    <rect x="36" y="396" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 404 L43 408 L49 400" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="408" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">.../auth/calendar.events</text>
    <g>
      <rect x="480" y="360" width="280" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="360"><tspan x="492" dy="18">Add both calendar scopes —</tspan><tspan x="492" dy="16">required for read + write</tspan></text>
    </g>
    <line x1="480" y1="388" x2="220" y2="388" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>