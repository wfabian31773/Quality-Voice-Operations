<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="app.qvo.ai/integrations/outlook">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">app.qvo.ai/integrations/outlook</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0f766e"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO · Integrations › Outlook Calendar</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <circle cx="60" cy="160" r="14" fill="#dcfce7"/>
    <path d="M54 160 L58 164 L66 156" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="84" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Connected as alex@acme.com</text>
    <text x="84" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pick which calendar QVO may book on.</text>
    <text x="36" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Calendar</text>
    <rect x="36" y="224" width="400" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="246" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">alex@acme.com · Calendar</text>
    <text x="460" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Timezone</text>
    <rect x="460" y="224" width="400" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="472" y="246" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">America/Los_Angeles</text>
    <text x="36" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Buffer before (min)</text>
    <rect x="36" y="296" width="190" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="318" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">5</text>
    <text x="246" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Buffer after (min)</text>
    <rect x="246" y="296" width="190" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="258" y="318" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">10</text>
    <text x="460" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Default appointment length</text>
    <rect x="460" y="296" width="400" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="472" y="318" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">30 minutes</text>
    <rect x="36" y="380" width="150" height="36" rx="6" fill="#0f172a"/>
    <text x="111" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Save</text>
    <rect x="196" y="380" width="130" height="36" rx="6" fill="#475569"/>
    <text x="261" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sync now</text>
    <g>
      <rect x="460" y="380" width="380" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="380"><tspan x="472" dy="18">Trigger Sync now to verify a test event lands on the chosen calendar</tspan></text>
    </g>
    
  </svg>