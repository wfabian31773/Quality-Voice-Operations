<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="app.qvo.ai/integrations/salesforce">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">app.qvo.ai/integrations/salesforce</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0f766e"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO · Integrations › Salesforce</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Connect Salesforce</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pick the Salesforce login host that matches your org type.</text>
    <text x="36" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Login host</text>
    <rect x="36" y="234" width="400" height="60" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <circle cx="58" cy="264" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="58" cy="264" r="4" fill="#0f172a"/>
    <text x="76" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Production</text>
    <text x="76" y="280" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">https://login.salesforce.com</text>
    <rect x="464" y="234" width="400" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="486" cy="264" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="504" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Sandbox</text>
    <text x="504" y="280" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">https://test.salesforce.com</text>
    <rect x="36" y="376" width="220" height="40" rx="6" fill="#00a1e0"/>
    <text x="146" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sign in with Salesforce</text>
    <g>
      <rect x="36" y="432" width="540" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="432"><tspan x="48" dy="18">A common failure: connecting a sandbox org while pointed at production</tspan></text>
    </g>
    
  </svg>