<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="developer.intuit.com/app/developer/myapps/keys">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">developer.intuit.com/app/developer/myapps/keys</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0077c5"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO Voice Agent · Keys & OAuth</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <g transform="translate(36,142)">
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
      <text x="90" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Development</text>
      <rect x="200" y="0" width="180" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="290" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">Production</text>
    </g>
    <g>
      <rect x="420" y="144" width="260" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="144"><tspan x="432" dy="18">Pick the environment first —</tspan><tspan x="432" dy="16">each has its own keys</tspan></text>
    </g>
    <line x1="420" y1="168" x2="220" y2="168" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="36" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Keys & credentials</text>
    <text x="36" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Client ID</text>
    <rect x="36" y="246" width="410" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="268" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">AB1234abcdEFghIJKLmnOPqrSTUVwxyz567890</text>
    <text x="466" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Client Secret</text>
    <rect x="466" y="246" width="410" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="478" y="268" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">••••••••••••  ⧉ Show</text>
    <text x="36" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Redirect URIs</text>
    <text x="36" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">URI</text>
    <rect x="36" y="346" width="828" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="368" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">https://app.qvo.ai/api/connectors/oauth/quickbooks/callback</text>
    <g>
      <rect x="36" y="410" width="540" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="410"><tspan x="48" dy="18">Set QUICKBOOKS_ENV=sandbox for Development creds, production for live</tspan></text>
    </g>
    
  </svg>