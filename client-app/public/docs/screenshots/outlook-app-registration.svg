<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="entra.microsoft.com/.../AppRegistrations">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">entra.microsoft.com/.../AppRegistrations</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0078d4"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Microsoft Entra · App registrations</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Register an application</text>
    <text x="36" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Name</text>
    <rect x="36" y="200" width="828" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="222" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">QVO Voice Agent</text>
    <text x="36" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Supported account types</text>
    <rect x="36" y="296" width="400" height="56" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <circle cx="58" cy="324" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="58" cy="324" r="4" fill="#0f172a"/>
    <text x="76" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Single tenant</text>
    <text x="76" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Accounts in this organizational directory only</text>
    <rect x="464" y="296" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="486" cy="324" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="504" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Multi-tenant</text>
    <text x="504" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Any Microsoft Entra directory</text>
    <text x="36" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Redirect URI (Web)</text>
    <text x="36" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569"></text>
    <rect x="36" y="402" width="828" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="424" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">https://app.qvo.ai/api/connectors/oauth/outlook/callback</text>
    <rect x="740" y="458" width="120" height="36" rx="6" fill="#0078d4"/>
    <text x="800" y="480" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Register</text>
    
  </svg>