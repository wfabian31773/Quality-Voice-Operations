<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="developers.pipedrive.com/apps/12345/scopes">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">developers.pipedrive.com/apps/12345/scopes</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#26292c"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO Voice Agent · Scopes</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Scopes & permissions</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pick the data your app needs to read or write.</text>
    <rect x="36" y="210" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 218 L43 222 L49 214" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="222" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">contacts:full — read/write Persons and Organizations</text>
    <rect x="36" y="240" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 248 L43 252 L49 244" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="252" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">deals:full — read/write Deals</text>
    <rect x="36" y="270" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 278 L43 282 L49 274" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="282" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">activities:full — log calls and meetings as Activities</text>
    <rect x="36" y="300" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 308 L43 312 L49 304" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="312" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">users:read — identify the connecting user</text>
    <rect x="36" y="330" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="342" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">leads:full</text>
    <rect x="36" y="360" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="372" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">mail:full</text>
    <rect x="36" y="390" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="60" y="402" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">projects:full</text>
    <rect x="740" y="440" width="120" height="36" rx="6" fill="#1aae47"/>
    <text x="800" y="462" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Save</text>
    <g>
      <rect x="480" y="220" width="240" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="220"><tspan x="492" dy="18">Tick exactly these four scopes</tspan></text>
    </g>
    <line x1="480" y1="240" x2="220" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>