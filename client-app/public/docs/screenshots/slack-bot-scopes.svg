<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="api.slack.com/apps/A12345/oauth">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">api.slack.com/apps/A12345/oauth</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#4a154b"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO · OAuth & Permissions</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Scopes</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Add permissions by adding OAuth scopes that authorize QVO to use the Slack API.</text>
    <text x="36" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Bot Token Scopes</text>
    <text x="36" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Scopes that govern what your app can access.</text>
    <rect x="36" y="248" width="828" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="270" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 278 L63 282 L69 274" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="282" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">chat:write — Send messages as @QVO</text>
    <rect x="56" y="300" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 308 L63 312 L69 304" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="312" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">channels:read — View basic information about public channels</text>
    <rect x="56" y="330" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 338 L63 342 L69 334" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="342" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">groups:read — View basic information about private channels</text>
    <rect x="56" y="360" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="80" y="372" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">users:read — View people in a workspace</text>
    <rect x="56" y="390" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="80" y="402" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">files:read — View files in a workspace</text>
    <rect x="740" y="250" width="120" height="32" rx="6" fill="#007a5a"/>
    <text x="800" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Add scope</text>
    <g>
      <rect x="460" y="442" width="240" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="442"><tspan x="472" dy="18">These three scopes are required</tspan></text>
    </g>
    <line x1="460" y1="458" x2="220" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>