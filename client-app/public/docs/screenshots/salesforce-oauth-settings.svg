<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="salesforce.com/lightning/setup/ConnectedApp/edit">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">salesforce.com/lightning/setup/ConnectedApp/edit</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#16325c"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">New Connected App · API (Enable OAuth Settings)</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">API (Enable OAuth Settings)</text>
    <rect x="36" y="188" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M39 196 L43 200 L49 192" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Enable OAuth Settings</text>
    <text x="36" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Callback URL</text>
    <rect x="36" y="220" width="828" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="242" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">https://app.qvo.ai/api/connectors/oauth/salesforce/callback</text>
    <text x="36" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Selected OAuth Scopes</text>
    <rect x="36" y="312" width="828" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="56" y="326" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 334 L63 338 L69 330" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="338" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Manage user data via APIs (api)</text>
    <rect x="56" y="354" width="16" height="16" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <path d="M59 362 L63 366 L69 358" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="366" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Perform requests at any time (refresh_token, offline_access)</text>
    <rect x="56" y="382" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="80" y="394" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Access the identity URL service (id, profile, email, address, phone)</text>
    <rect x="56" y="408" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    
    <text x="80" y="420" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">Full access (full)</text>
    <g>
      <rect x="36" y="450" width="400" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="450"><tspan x="48" dy="18">Tick exactly these two scope groups · 3 OAuth scopes total</tspan></text>
    </g>
    
  </svg>