<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="developer.intuit.com/app/developer/myapps">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">developer.intuit.com/app/developer/myapps</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0077c5"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Intuit Developer · My Apps</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Create an app</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pick the platform you want to build on.</text>
    <rect x="36" y="208" width="400" height="170" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <rect x="56" y="228" width="40" height="40" rx="6" fill="#2ca01c"/>
    <text x="76" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">qb</text>
    <text x="108" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">QuickBooks Online</text>
    <text x="108" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">+ Payments</text>
    <text x="56" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">App name</text>
    <rect x="56" y="304" width="360" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="326" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">QVO Voice Agent</text>
    <rect x="464" y="208" width="400" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="484" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">QuickBooks Desktop</text>
    <text x="484" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">For locally hosted accounting files.</text>
    <rect x="736" y="410" width="130" height="36" rx="6" fill="#0077c5"/>
    <text x="801" y="432" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Create app</text>
    <g>
      <rect x="36" y="410" width="280" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="410"><tspan x="48" dy="18">Pick QuickBooks Online + Payments</tspan></text>
    </g>
    
  </svg>