<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="entra.microsoft.com/.../qvo-voice-agent/secrets">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">entra.microsoft.com/.../qvo-voice-agent/secrets</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0078d4"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO Voice Agent · Certificates & secrets</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <g transform="translate(36,144)">
      <text x="0" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748b">Certificates</text>
      <text x="90" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Client secrets</text><rect x="86" y="4" width="99" height="2" fill="#0f172a"/>
      <text x="200" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748b">Federated credentials</text>
    </g>
    <rect x="740" y="144" width="130" height="32" rx="6" fill="#0078d4"/>
    <text x="805" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ New client secret</text>
    <text x="36" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Client secrets</text>
    <text x="36" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">A secret string that the application uses to prove its identity. Also called a key.</text>
    <rect x="36" y="244" width="828" height="40" rx="6" fill="#f8fafc"/>
    <text x="56" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Description</text>
    <text x="280" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Expires</text>
    <text x="440" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Value</text>
    <rect x="36" y="284" width="828" height="60" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="6"/>
    <text x="56" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0f172a">QVO production secret</text>
    <text x="280" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0f172a">22/04/2028</text>
    <rect x="440" y="296" width="320" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="452" y="319" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">8Q~aBcD.eFgHi-jKlMn0pQrStUvWxYz12345</text>
    <rect x="770" y="296" width="90" height="36" rx="6" fill="#475569"/>
    <text x="815" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⧉ Copy</text>
    <g>
      <rect x="36" y="380" width="360" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="380"><tspan x="48" dy="18">Copy the Value column NOW —</tspan><tspan x="48" dy="16">it is hidden after you leave the page</tspan></text>
    </g>
    <line x1="360" y1="408" x2="600" y2="344" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>