<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="app.pipedrive.com/settings/api">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">app.pipedrive.com/settings/api</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#26292c"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Pipedrive · Settings › Personal preferences › API</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">API key</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Use this token to authenticate as you. Tied to your Pipedrive user account.</text>
    <text x="36" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Personal API token</text>
    <rect x="36" y="224" width="700" height="34" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <text x="48" y="246" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0f172a">b8a9c0d1e2f3a4b5c6d7e8f90123456789abcdef</text>
    <rect x="752" y="224" width="110" height="34" rx="6" fill="#475569"/>
    <text x="807" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⧉ Copy</text>
    <text x="36" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Company domain</text>
    <rect x="36" y="296" width="400" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="318" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">yourcompany</text>
    <text x="442" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">.pipedrive.com</text>
    <g>
      <rect x="36" y="380" width="360" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="380"><tspan x="48" dy="18">Paste both into QVO →</tspan><tspan x="48" dy="16">Integrations → Pipedrive → Use API token</tspan></text>
    </g>
    <line x1="220" y1="380" x2="220" y2="264" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="220" y1="380" x2="220" y2="332" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    
  </svg>