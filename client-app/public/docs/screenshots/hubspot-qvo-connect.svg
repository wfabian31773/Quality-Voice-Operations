<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="app.qvo.ai/integrations/hubspot">
    <defs>
      <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#eef2f7"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
    <rect width="900" height="520" rx="14" fill="url(#bg)"/>
    <!-- Browser chrome -->
    <rect x="14" y="14" width="872" height="36" rx="8" fill="#e2e8f0"/>
    <circle cx="34" cy="32" r="5" fill="#ef4444"/>
    <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="66" cy="32" r="5" fill="#22c55e"/>
    <rect x="86" y="22" width="790" height="20" rx="6" fill="#ffffff"/>
    <text x="98" y="36" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">app.qvo.ai/integrations/hubspot</text>
    <!-- App header -->
    <rect x="14" y="58" width="872" height="46" rx="8" fill="#0f766e"/>
    <text x="34" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">QVO · Integrations › HubSpot</text>
    <!-- Body container -->
    <rect x="14" y="116" width="872" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="36" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Connect HubSpot</text>
    <text x="36" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Authorize QVO to log calls and update contacts in your portal.</text>
    <rect x="36" y="200" width="400" height="180" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">OAuth (recommended)</text>
    <text x="56" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Per-user attribution · refresh tokens rotate</text>
    <rect x="56" y="320" width="200" height="40" rx="6" fill="#ff7a59"/>
    <text x="156" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sign in with HubSpot</text>
    <rect x="464" y="200" width="400" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="484" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Use access token</text>
    <text x="484" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">For private apps · single workspace</text>
    <text x="484" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Access token</text>
    <rect x="484" y="280" width="360" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="496" y="302" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#0f172a">pat-…</text>
    <rect x="484" y="332" width="130" height="34" rx="6" fill="#0f172a"/>
    <text x="549" y="353" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
    <g>
      <rect x="36" y="410" width="480" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" y="410"><tspan x="48" dy="18">Pick OAuth for production — pick token for a single quick test</tspan></text>
    </g>
    
  </svg>