id: v1-tickets-bb-different-callback-number
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:tickets, template:barbershop, lang:en, action:tickets.open, spec:3.6-2]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "I left my jacket at the shop yesterday. Can someone call me? Not this number, I'm at work. Call 555-555-0199. Name's Luis."
  - text: "Yes, 555-555-0199."
script:
  - on: 0
    steps:
      # The callback number differs from caller ID; use what the caller gave.
      - call:
          name: tickets.open.prepare
          input:
            kind: callback
            subject: jacket left at the shop
            details: Left a jacket at the shop yesterday. Call back on the number given, not caller ID.
            customer:
              name: Luis
              phone: "+15555550199"
            urgency: normal
      - say: "{{readback}}. That's 555-555-0199. Is that right?"
  - on: 1
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "I've let them know. Someone will call you at 555-555-0199."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: callback
        customer:
          name: Luis
          phone: "+15555550199"
    - name: tickets.open.commit
  endState:
    tickets:
      count: 1
      kind: callback
      status: open
  mustSay:
    - "555-555-0199"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
