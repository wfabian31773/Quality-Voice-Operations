id: v1-tickets-ns-urgent-keyword
template: nail_salon
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:tickets, template:nail_salon, lang:en, action:tickets.open, spec:3.5-urgent]
seed: nail-salon-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "It's urgent. My gel set from yesterday is lifting and my wedding is in three hours. Can someone call me right away? I'm Grace."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      # "urgent" is a template urgent keyword → urgency: urgent.
      - call:
          name: tickets.open.prepare
          input:
            kind: callback
            subject: gel set lifting, wedding in three hours
            details: Gel set done yesterday is lifting; wedding in three hours. Wants a call right away.
            customer:
              name: Grace
              phone: "+15555550133"
            urgency: urgent
      - say: "I'll mark this urgent. {{readback}}. Is that right?"
  - on: 1
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "I've let them know it's urgent. Linh will call you back as soon as possible."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: callback
        urgency: urgent
        customer:
          name: Grace
    - name: tickets.open.commit
  endState:
    tickets:
      count: 1
      kind: callback
      status: open
  mustSay:
    - "urgent"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
