id: v1-sched-bb-commit-retry-same-token
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-9, spec:0.1-idempotency]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
# The first commit times out on the network and the agent retries it with the
# same token (spec §1.6 #9). Commits are idempotent on the token (PR-13 /
# runAction), so the retry replays the first result and one booking exists.
caller:
  - text: "Can Andre do a men's cut Friday at 1?"
  - text: "Yes, please."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: andre
            date: "2026-10-23"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: andre
            start: "2026-10-23T13:00:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "Let me read that back: {{readback}}. Is that right?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      # Network retry of the same commit, same token.
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Andre on Friday at 1:00."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        staffId: andre
        start: "2026-10-23T13:00:00-04:00"
    - name: scheduling.book.commit
    - name: scheduling.book.commit
  endState:
    bookings:
      # Exactly one booking after the retried commit.
      count: 1
      items:
        - status: confirmed
          staffId: andre
          date: "2026-10-23"
          startLocal: "13:00"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
