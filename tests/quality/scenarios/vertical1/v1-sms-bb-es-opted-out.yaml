id: v1-sms-bb-es-opted-out
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:sms, tool:scheduling, template:barbershop, lang:es, action:sms.send_confirmation, spec:2.6-1, spec:2.5-opted-out, expected-fail]
# Jorge (+15555550188) texted STOP last month.
seed: barbershop-basic:sms-opted-out
now: "2026-10-20T14:00:00-04:00"
# sms.send_confirmation.* is not in FakeToolProvider, so the prepare fails with
# NOT_FOUND instead of RECIPIENT_OPTED_OUT and the refusal is never relayed.
# Spanish readback blocked on matcher follow-up: matcher accepts Spanish
# readback. The agent reads the booking back in Spanish, and readbackRequired
# only accepts the fake's English readback verbatim, so that check fails too.
expectedFail: PR-17
caller:
  - text: "Hola, un corte con Andre mañana a la 1, y mándeme un mensaje de confirmación. Soy Jorge."
  - text: "Sí, correcto."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: andre
            date: "2026-10-21"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: andre
            start: "2026-10-21T13:00:00-04:00"
            customer:
              name: Jorge
              phone: "+15555550188"
      - say: "Le confirmo: un corte de caballero con Andre, mañana miércoles 21 de octubre a la 1:00 de la tarde, a nombre de Jorge, al número que termina en 0188. ¿Es correcto?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      # The chokepoint refuses an opted-out number (RECIPIENT_OPTED_OUT). The
      # agent relays the server's callerSafeMessage, in the caller's locale.
      - call:
          name: sms.send_confirmation.prepare
          input:
            bookingId: "{{bookingId}}"
            kind: confirmation
      - say: "Listo, tiene su cita con Andre mañana a la 1. {{callerSafeMessage}}"
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        staffId: andre
        customer:
          name: Jorge
          phone: "+15555550188"
    - name: scheduling.book.commit
    - name: sms.send_confirmation.prepare
      input:
        kind: confirmation
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: andre
          date: "2026-10-21"
          startLocal: "13:00"
  # Spec §2.5 RECIPIENT_OPTED_OUT callerSafeMessage, in Spanish.
  mustSay:
    - "No puedo enviarle mensajes"
  mustNotSay:
    - "le envié"
    - "le mandé el mensaje"
    - "le llegará un mensaje"
    - "I've texted you"
    - "you're booked"
    - "I've sent"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "ya le avisé"
  readbackRequired: true
