id: v1-sched-bb-reschedule-inside-window
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, tool:tickets, template:barbershop, lang:en, action:scheduling.reschedule, spec:0.2-identity, spec:1.6-8]
# Luis (caller ID matches) has tomorrow 10:00 with Andre, 20 hours away; the
# shop needs 24 hours' notice. The reschedule is refused with OUTSIDE_POLICY,
# the agent states the policy and takes a message for the owner instead.
seed: barbershop-basic:booking-tomorrow
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Hi, this is Luis. Can I move my appointment tomorrow morning to Friday at 10?"
  - text: "Okay, yes, please leave them a message."
  - text: "Yes."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.find_bookings
          input:
            phone: "+15555550142"
            name: Luis
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: andre
            date: "2026-10-23"
      - call:
          name: scheduling.reschedule.prepare
          input:
            bookingId: bk_luis_wed
            newStart: "2026-10-23T10:00:00-04:00"
            staffId: andre
      - say: "{{callerSafeMessage}} Would you like me to do that?"
  - on: 1
    steps:
      - call:
          name: tickets.open.prepare
          input:
            kind: message
            subject: "Move tomorrow's 10:00 with Andre to Friday at 10"
            details: "Asked to reschedule inside the 24-hour cancellation window."
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "Thanks, Luis. Your message is with the shop, and your appointment tomorrow at 10 is unchanged."
expect:
  actions:
    - name: scheduling.find_bookings
      input:
        phone: "+15555550142"
        name: Luis
    - name: scheduling.reschedule.prepare
      input:
        bookingId: bk_luis_wed
    - name: tickets.open.prepare
      input:
        kind: message
    - name: tickets.open.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: andre
          date: "2026-10-21"
          startLocal: "10:00"
    tickets:
      count: 1
      kind: message
      status: open
  mustSay:
    - "24 hours' notice"
    - "take a message"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
    - "I've moved"
    - "has been moved"
    - "I've cancelled"
  readbackRequired: true
