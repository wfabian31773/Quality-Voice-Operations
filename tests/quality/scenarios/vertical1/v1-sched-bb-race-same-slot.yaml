id: v1-sched-bb-race-same-slot
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-1, spec:0.2-failure-truth, conflict]
# Another caller's line already holds Marco's 3:30 (see fixture variant).
seed: barbershop-basic:slot-held-by-other-caller
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "I saw Marco has 3:30 today. Can I grab it? It's Luis."
  - text: "4:30 then."
  - text: "Yes."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-20T15:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      # CONFLICT: re-check before offering anything else.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-20"
            partOfDay: afternoon
      - say: "Sorry, 3:30 was just taken. Marco still has 4:30 today. Would that work?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-20T16:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Marco today at 4:30."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        staffId: marco
        start: "2026-10-20T15:30:00-04:00"
    - name: scheduling.check_availability
      input:
        staffId: marco
        date: "2026-10-20"
    - name: scheduling.book.prepare
      input:
        staffId: marco
        start: "2026-10-20T16:30:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      # The other caller's hold plus this caller's confirmed booking.
      count: 2
      items:
        - status: held
          staffId: marco
          date: "2026-10-20"
          startLocal: "15:30"
        - status: confirmed
          staffId: marco
          date: "2026-10-20"
          startLocal: "16:30"
  mustSay:
    - "just taken"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
