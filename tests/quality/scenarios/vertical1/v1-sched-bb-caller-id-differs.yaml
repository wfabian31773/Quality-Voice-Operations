id: v1-sched-bb-caller-id-differs
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, tool:tickets, template:barbershop, lang:en, action:scheduling.find_bookings, spec:0.2-identity, spec:1.6-7]
# Luis has Thursday 10:00 with Marco, booked from +15555550142, but he is
# calling from his work phone: no caller-ID match, so find_bookings needs
# name + date + time. He doesn't know the time, so nothing is found or
# changed, the time is never offered, and the agent takes a message.
seed: barbershop-basic:existing-booking
callerId: "+15555550199"
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Hi, this is Luis. I'm on my work phone. I need to move my appointment this week, it's under 555-555-0142."
  - text: "It's on Thursday, but I don't remember the time."
  - text: "Sure, have them call me back on this number."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.find_bookings
          input:
            phone: "+15555550142"
            name: Luis
      - say: "I can help. Since you're calling from a different number, I need the name, the day and the time of the appointment."
  - on: 1
    steps:
      - call:
          name: scheduling.find_bookings
          input:
            phone: "+15555550142"
            name: Luis
            date: "2026-10-22"
      - say: "Without the time I can't look up or change that appointment from this number. I can take a message for the shop so they call you back."
  - on: 2
    steps:
      - call:
          name: tickets.open.prepare
          input:
            kind: callback
            subject: "Move a Thursday appointment"
            details: "Caller wants to move an appointment booked under 555-555-0142; called from another number and could not give the time."
            customer:
              name: Luis
              phone: "+15555550199"
      - say: "{{readback}}. Is that right?"
  - on: 3
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "Thanks, Luis. Marco will call you back on this number."
expect:
  actions:
    - name: scheduling.find_bookings
      input:
        phone: "+15555550142"
        name: Luis
    - name: scheduling.find_bookings
      input:
        date: "2026-10-22"
    - name: tickets.open.prepare
      input:
        kind: callback
    - name: tickets.open.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-22"
          startLocal: "10:00"
    tickets:
      count: 1
      kind: callback
      status: open
  mustSay:
    - "take a message"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
    - "I've moved"
    - "I've cancelled"
    # The time is never offered to an unverified caller.
    - "10:00"
    - "10 AM"
    - "at 10"
  readbackRequired: true
