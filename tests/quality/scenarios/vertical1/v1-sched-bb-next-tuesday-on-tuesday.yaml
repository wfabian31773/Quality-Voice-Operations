id: v1-sched-bb-next-tuesday-on-tuesday
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-2, relative-date]
seed: barbershop-basic
# Tuesday Oct 20: "next Tuesday" is ambiguous, so the agent says the date.
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Does Tony have anything next Tuesday?"
  - text: "Yes, the 27th."
  - text: "3:30, please. Luis."
  - text: "Yes."
script:
  - on: 0
    steps:
      - say: "Next Tuesday, that's the 27th?"
  - on: 1
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: tony
            date: "2026-10-27"
      - say: "Tony has Tuesday the 27th at 10:00, 1:00 or 3:30."
  - on: 2
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: tony
            start: "2026-10-27T15:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 3
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Tony on Tuesday the 27th at 3:30."
expect:
  actions:
    - name: scheduling.check_availability
      input:
        staffId: tony
        date: "2026-10-27"
    - name: scheduling.book.prepare
      input:
        staffId: tony
        start: "2026-10-27T15:30:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: tony
          date: "2026-10-27"
          startLocal: "15:30"
  mustSay:
    - "the 27th"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
