id: v1-sched-bb-staff-off-alternatives
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-4, no-availability]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Can I get a cut with Marco tomorrow?"
  - text: "Thursday at 1 works. Luis."
  - text: "Correct."
script:
  - on: 0
    steps:
      # Marco is off Wednesdays; the shop is open.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-21"
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-22"
      # Who else is in tomorrow: Andre and Tony, 10:00, 1:00, 3:30 or 4:30.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: any
            date: "2026-10-21"
      - say: "Marco doesn't have anything tomorrow. His next day is Thursday: 10:00, 1:00 or 3:30. If you'd rather keep the day, Andre and Tony both have 10:00, 1:00, 3:30 or 4:30 tomorrow."
  - on: 1
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-22T13:00:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Marco on Thursday at 1."
expect:
  actions:
    - name: scheduling.check_availability
      input:
        staffId: marco
        date: "2026-10-21"
    - name: scheduling.check_availability
      input:
        staffId: marco
        date: "2026-10-22"
    - name: scheduling.check_availability
      input:
        staffId: any
        date: "2026-10-21"
    - name: scheduling.book.prepare
      input:
        staffId: marco
        start: "2026-10-22T13:00:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-22"
          startLocal: "13:00"
  mustSay:
    - "Thursday"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
