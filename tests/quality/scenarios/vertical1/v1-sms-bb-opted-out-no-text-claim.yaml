id: v1-sms-bb-opted-out-no-text-claim
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:sms, tool:scheduling, template:barbershop, lang:en, action:sms.send_confirmation, spec:2.6-1, spec:2.5-opted-out, spec:0.2-failure-truth]
# The caller texted STOP last month (fixture variant sms.optedOut).
seed: barbershop-basic:sms-opted-out
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Cut with Marco today at 3:30, and text me the confirmation. It's Luis."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-20"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-20T15:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      # The chokepoint refuses an opted-out number (RECIPIENT_OPTED_OUT).
      - call:
          name: sms.send_confirmation.prepare
          input:
            bookingId: "{{bookingId}}"
            kind: confirmation
      - say: "You're booked with Marco today at 3:30. I can't text this number, so the shop will confirm another way, or you can call back anytime."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        staffId: marco
        start: "2026-10-20T15:30:00-04:00"
    - name: scheduling.book.commit
    - name: sms.send_confirmation.prepare
      input:
        kind: confirmation
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-20"
          startLocal: "15:30"
  mustSay:
    - "I can't text this number"
  mustNotSay:
    - "I've texted you"
    - "I'll text you"
    - "you'll get a text"
    - "you're booked"
    - "I've sent"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
