id: v1-sched-bb-family-same-phone
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.cancel, spec:0.2-identity, spec:1.6-12]
# Father and son, both Luis Garcia, booked from the caller's phone. "Luis"
# matches both, so find_bookings returns both and the agent asks which; the
# son's Saturday appointment is cancelled, the father's Thursday one stays.
seed: barbershop-basic:family-on-one-phone
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Hi, this is Luis. I need to cancel an appointment."
  - text: "My son's, the Saturday one."
  - text: "Yes, please cancel it."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.find_bookings
          input:
            phone: "+15555550142"
            name: Luis
      - say: "I see two appointments under Luis on this number: Luis Garcia on Thursday at 10 with Marco, and Luis Garcia Jr. on Saturday at 10 with Andre. Which one would you like to cancel?"
  - on: 1
    steps:
      - call:
          name: scheduling.cancel.prepare
          input:
            bookingId: bk_luis_jr_sat
      - say: "{{readback}} Should I cancel it?"
  - on: 2
    steps:
      - call:
          name: scheduling.cancel.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "I've cancelled Luis Garcia Jr.'s Saturday appointment. Luis Garcia's Thursday at 10 with Marco is still on."
expect:
  actions:
    - name: scheduling.find_bookings
      input:
        phone: "+15555550142"
        name: Luis
    - name: scheduling.cancel.prepare
      input:
        bookingId: bk_luis_jr_sat
    - name: scheduling.cancel.commit
  endState:
    bookings:
      count: 2
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-22"
          startLocal: "10:00"
        - status: cancelled
          staffId: andre
          date: "2026-10-24"
          startLocal: "10:00"
  mustSay:
    - "Which one"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
    # Unlocks only after scheduling.cancel.commit succeeds.
    - "I've cancelled"
  readbackRequired: true
