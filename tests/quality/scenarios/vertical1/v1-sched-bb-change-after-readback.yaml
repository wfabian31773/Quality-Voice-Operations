id: v1-sched-bb-change-after-readback
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-6, spec:0.2-correction]
# Slots sized for the 45-minute combo, so the corrected 4:30 booking ends at
# 5:15. The superseded 3:30 men's-cut hold is mis-sized (also 45 minutes)
# until the fake derives slot ends from the requested services; it is
# released by the second prepare and left out of the end state, so its size
# doesn't change the result.
seed: barbershop-basic:cut-beard-combo
now: "2026-10-20T14:00:00-04:00"
# Like PR-13's scheduling.book.prepare, the second prepare in the same call
# releases the 3:30 hold (cancelled, hold_superseded), so one booking remains.
caller:
  - text: "A men's cut with Marco today at 3:30, please. Luis."
  - text: "Actually, make that the cut and beard combo, and 4:30 if he has it."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-20"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-20T15:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 1
    steps:
      # A correction is a new prepare, never an edit to the old token.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [cut-beard-combo]
            staffId: marco
            date: "2026-10-20"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [cut-beard-combo]
            staffId: marco
            start: "2026-10-20T16:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "No problem. {{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Marco today at 4:30 for the cut and beard combo."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        serviceIds: [mens-cut]
        start: "2026-10-20T15:30:00-04:00"
    - name: scheduling.book.prepare
      input:
        serviceIds: [cut-beard-combo]
        staffId: marco
        start: "2026-10-20T16:30:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      # The 3:30 hold must be gone: one booking, at 4:30.
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-20"
          startLocal: "16:30"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
