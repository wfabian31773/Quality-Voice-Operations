id: v1-sched-bb-change-after-readback
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-6, spec:0.2-correction, expected-fail]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
# FakeToolProvider never releases the first hold, so the 3:30 hold is still
# there at the end (two rows). PR-13's prepare releases the call's old hold.
expectedFail: PR-13
caller:
  - text: "A men's cut with Marco today at 3:30, please. Luis."
  - text: "Actually, make that the cut and beard combo, and 4:30 if he has it."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-20"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: marco
            start: "2026-10-20T15:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 1
    steps:
      # A correction is a new prepare, never an edit to the old token.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [cut-beard-combo]
            staffId: marco
            date: "2026-10-20"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [cut-beard-combo]
            staffId: marco
            start: "2026-10-20T16:30:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "No problem. {{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Marco today at 4:30 for the cut and beard combo."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        serviceIds: [mens-cut]
        start: "2026-10-20T15:30:00-04:00"
    - name: scheduling.book.prepare
      input:
        serviceIds: [cut-beard-combo]
        staffId: marco
        start: "2026-10-20T16:30:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      # The 3:30 hold must be gone: one booking, at 4:30.
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-20"
          startLocal: "16:30"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
