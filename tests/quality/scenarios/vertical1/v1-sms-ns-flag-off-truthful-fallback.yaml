id: v1-sms-ns-flag-off-truthful-fallback
template: nail_salon
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:sms, tool:scheduling, template:nail_salon, lang:en, action:sms.send_confirmation, spec:2.5-messaging-not-enabled, spec:0.2-failure-truth]
# SMS_ENABLED is off for this tenant (fixture variant sms.messagingEnabled=false).
seed: nail-salon-basic:sms-disabled
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Can I get a manicure with Kim Friday at 1? Can you text me a confirmation? I'm Dee."
  - text: "Yes."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [manicure]
            staffId: kim
            date: "2026-10-23"
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [manicure]
            staffId: kim
            start: "2026-10-23T13:00:00-04:00"
            customer:
              name: Dee
              phone: "+15555550155"
      - say: "{{readback}}. Is that right?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      # MESSAGING_NOT_ENABLED from the chokepoint.
      - call:
          name: sms.send_confirmation.prepare
          input:
            bookingId: "{{bookingId}}"
            kind: confirmation
      - say: "You're booked with Kim on Friday at 1. I can't text this number right now; the salon will confirm by email, or you can call back."
expect:
  actions:
    - name: scheduling.book.prepare
      input:
        staffId: kim
        start: "2026-10-23T13:00:00-04:00"
    - name: scheduling.book.commit
    - name: sms.send_confirmation.prepare
      input:
        kind: confirmation
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: kim
          date: "2026-10-23"
          startLocal: "13:00"
  mustSay:
    - "I can't text this number"
  mustNotSay:
    - "I've texted you"
    - "I'll text you"
    - "you'll get a text"
    - "you're booked"
    - "I've sent"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
