id: v1-tickets-ns-refuses-name
template: nail_salon
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:tickets, template:nail_salon, lang:en, action:tickets.open, spec:3.6-1]
seed: nail-salon-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Can someone call me about whether you do custom nail art?"
  - text: "I'd rather not give my name. Just call this number."
  - text: "Yes."
script:
  - on: 0
    steps:
      - say: "Sure. Can I get your name for the message?"
  - on: 1
    steps:
      # No invented name: the customer block carries only the phone.
      - call:
          name: tickets.open.prepare
          input:
            kind: message
            subject: custom nail art
            details: Caller asks whether the salon does custom nail art. Declined to give a name.
            customer:
              phone: "+15555550144"
            urgency: normal
      - say: "No problem. {{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "I've let them know. Someone will call this number back."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: message
        customer:
          phone: "+15555550144"
    - name: tickets.open.commit
  endState:
    tickets:
      count: 1
      kind: message
      status: open
  mustSay:
    # The readback falls back to "the caller" only when no name was sent.
    - "for the caller"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
