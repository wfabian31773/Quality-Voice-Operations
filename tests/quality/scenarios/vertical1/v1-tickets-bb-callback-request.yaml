id: v1-tickets-bb-callback-request
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:tickets, template:barbershop, lang:en, action:tickets.open, spec:3.5-collect]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Can Marco call me back? I want to set up a standing cut every three weeks."
  - text: "Luis, this number, any time after 3."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      # Recurring appointments aren't bookable in v1, so this becomes a callback.
      - say: "I can't set up a recurring appointment, but I can have Marco call you back. Can I get your name and the best time to reach you?"
  - on: 1
    steps:
      - call:
          name: tickets.open.prepare
          input:
            kind: callback
            subject: standing cut every three weeks
            details: Caller wants a recurring cut every three weeks with Marco. Best time after 3 PM.
            customer:
              name: Luis
              phone: "+15555550142"
            urgency: normal
            callbackWindow: today after 3 PM
      - say: "{{readback}}, after 3 PM. Is that right?"
  - on: 2
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "I've let them know. Marco will call you back."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: callback
        customer:
          name: Luis
          phone: "+15555550142"
        urgency: normal
    - name: tickets.open.commit
  endState:
    bookings:
      count: 0
    tickets:
      count: 1
      kind: callback
      status: open
  mustSay:
    - "call you back"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
