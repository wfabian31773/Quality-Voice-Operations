id: v1-sched-bb-reschedule-verified
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.reschedule, spec:0.2-identity]
# Luis has Thursday 10:00 with Marco; caller ID (the seed's callerNumber) matches.
seed: barbershop-basic:existing-booking
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "Hi, this is Luis. I need to move my Thursday appointment with Marco to Friday."
  - text: "1:00 on Friday."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      # Identity: caller-ID match and the name on the booking.
      - call:
          name: scheduling.find_bookings
          input:
            phone: "+15555550142"
            name: Luis
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: marco
            date: "2026-10-23"
      - say: "I see your Thursday at 10 with Marco. On Friday he has 10:00, 1:00 or 3:30."
  - on: 1
    steps:
      - call:
          name: scheduling.reschedule.prepare
          input:
            bookingId: bk_luis_thu
            newStart: "2026-10-23T13:00:00-04:00"
            staffId: marco
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.reschedule.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "Done. Your appointment is now Friday at 1:00 with Marco."
expect:
  actions:
    - name: scheduling.find_bookings
      input:
        phone: "+15555550142"
        name: Luis
    - name: scheduling.reschedule.prepare
      input:
        bookingId: bk_luis_thu
        newStart: "2026-10-23T13:00:00-04:00"
    - name: scheduling.reschedule.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-23"
          startLocal: "13:00"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
    - "I've moved"
  readbackRequired: true
