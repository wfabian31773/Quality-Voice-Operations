id: v1-tickets-ns-es-callback
template: nail_salon
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:tickets, template:nail_salon, lang:es, action:tickets.open, spec:3.6-8, expected-fail]
seed: nail-salon-basic
now: "2026-10-20T14:00:00-04:00"
# Spanish readback blocked on matcher follow-up: matcher accepts Spanish
# readback. The agent reads the message back in Spanish, and readbackRequired
# only accepts the fake's English readback verbatim. No product PR fixes this,
# so the ledger id names the follow-up instead of a PR.
expectedFail: matcher-es-readback
caller:
  - text: "Hola, quiero que Linh me llame para cotizar uñas para cinco damas de honor. Me llamo Ana."
  - text: "Sí, está bien."
script:
  - on: 0
    steps:
      # Stored in the caller's words plus an English summary.
      - call:
          name: tickets.open.prepare
          input:
            kind: callback
            subject: bridal party quote, five people
            details: "Quiere una cotización de uñas para cinco damas de honor. EN: wants a nail quote for five bridesmaids."
            customer:
              name: Ana
              phone: "+15555550122"
            urgency: normal
      - say: "Le confirmo: le paso a Linh que usted quiere que la llame para cotizar uñas para cinco damas de honor, a nombre de Ana, al número que termina en 0122. ¿Está bien?"
  - on: 1
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "Listo, Linh le devolverá la llamada."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: callback
        customer:
          name: Ana
          phone: "+15555550122"
    - name: tickets.open.commit
  endState:
    bookings:
      count: 0
    tickets:
      count: 1
      kind: callback
      status: open
  mustSay:
    - "Linh"
  mustNotSay:
    - "ya le avisé"
    - "ya le dije"
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
  readbackRequired: true
