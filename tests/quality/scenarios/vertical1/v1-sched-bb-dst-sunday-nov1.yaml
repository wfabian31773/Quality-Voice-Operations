id: v1-sched-bb-dst-sunday-nov1
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-3, dst]
seed: barbershop-basic
# Saturday Oct 31 (EDT, -04:00). Tomorrow is Sun Nov 1, after the 2 AM
# fall-back, so 10 AM local is -05:00.
now: "2026-10-31T12:00:00-04:00"
caller:
  - text: "Can I come in tomorrow at 10 for a cut? Anyone."
  - text: "Luis. Yes, 10."
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut]
            staffId: any
            date: "2026-11-01"
      - say: "Tomorrow is Sunday, November 1st. We have 10:00 with Marco. Can I get your name?"
  - on: 1
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut]
            staffId: any
            start: "2026-11-01T10:00:00-05:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked for Sunday, November 1st at 10 AM."
expect:
  actions:
    - name: scheduling.check_availability
      input:
        date: "2026-11-01"
    - name: scheduling.book.prepare
      input:
        start: "2026-11-01T10:00:00-05:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-11-01"
          startLocal: "10:00"
  mustSay:
    - "November 1"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
