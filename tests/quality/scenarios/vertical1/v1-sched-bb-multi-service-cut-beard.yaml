id: v1-sched-bb-multi-service-cut-beard
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [vertical1, tool:scheduling, template:barbershop, lang:en, action:scheduling.book, spec:1.6-5, multi-service]
seed: barbershop-basic
now: "2026-10-20T14:00:00-04:00"
caller:
  - text: "I want a cut and a beard trim Thursday morning, whoever's free."
  - text: "10 is good. Luis."
  - text: "That's right."
script:
  - on: 0
    steps:
      # Only Marco does both services.
      - call:
          name: scheduling.check_availability
          input:
            serviceIds: [mens-cut, beard-trim]
            staffId: any
            date: "2026-10-22"
            partOfDay: morning
      - say: "Marco is the one who does both. He has Thursday at 10:00."
  - on: 1
    steps:
      - call:
          name: scheduling.book.prepare
          input:
            serviceIds: [mens-cut, beard-trim]
            staffId: marco
            start: "2026-10-22T10:00:00-04:00"
            customer:
              name: Luis
              phone: "+15555550142"
      - say: "{{readback}}. Is that right?"
  - on: 2
    steps:
      - call:
          name: scheduling.book.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "You're booked with Marco on Thursday at 10 for a cut and beard trim."
expect:
  actions:
    - name: scheduling.check_availability
      input:
        serviceIds: [mens-cut, beard-trim]
        staffId: any
        date: "2026-10-22"
    - name: scheduling.book.prepare
      input:
        serviceIds: [mens-cut, beard-trim]
        staffId: marco
        start: "2026-10-22T10:00:00-04:00"
    - name: scheduling.book.commit
  endState:
    bookings:
      count: 1
      items:
        - status: confirmed
          staffId: marco
          date: "2026-10-22"
          startLocal: "10:00"
  mustSay:
    - "beard trim"
  mustNotSay:
    - "you're booked"
    - "I've sent"
    - "I've texted you"
    - "I've let them know"
    - "your order is in"
    - "ya está reservado"
    - "quedó confirmada"
    - "quedó confirmado"
    - "su cita está confirmada"
    - "ya quedó"
    - "quedó registrado"
    - "le envié"
    - "ya le avisé"
  readbackRequired: true
