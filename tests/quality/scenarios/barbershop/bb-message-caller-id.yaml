id: bb-message-caller-id
template: barbershop
tools: [scheduling, sms, tickets, business, calls]
tags: [barbershop, core, flow:message-caller-id, template:barbershop, lang:en]
# tickets.message@1 with caller ID present: the callback number is held from
# caller ID, so prepare runs once (no ask) and the ticket carries that number.
seed: barbershop-basic
callerId: "+15555550142"
now: "2026-10-20T14:00:00-04:00"
floor: true
caller:
  - text: "Hi, this is Luis. Can you tell Marco I'll be ten minutes late to my cut Thursday?"
  - text: "Yes, that's right."
script:
  - on: 0
    steps:
      - call:
          name: tickets.open.prepare
          input:
            kind: message
            subject: Running ten minutes late to Thursday's cut
            customer:
              name: Luis
      - say: "{{readback}}. Is that right?"
  - on: 1
    steps:
      - call:
          name: tickets.open.commit
          input:
            confirmationToken: "{{confirmationToken}}"
      - say: "Done. Marco will get your message."
expect:
  actions:
    - name: tickets.open.prepare
      input:
        kind: message
    - name: tickets.open.commit
  endState:
    bookings:
      count: 0
    tickets:
      count: 1
      items:
        - kind: message
          status: open
          floor: false
          phone: "+15555550142"
  toolAttempts:
    tickets.open.prepare: 1
  readbackRequired: true
