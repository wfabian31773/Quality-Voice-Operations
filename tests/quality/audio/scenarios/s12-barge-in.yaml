# S12 (plan F10): barge-in. The caller asks if the shop is open; the agent
# starts "let me check" and calls a read tool whose result is slow. 1.5 s
# into that line the caller talks over the agent. The model streams audio
# faster than real time, so Twilio still holds seconds of the interrupted
# line: the gateway must send Twilio `clear` so the caller stops hearing it,
# the tool result that lands while the caller is talking must not start an
# answer of its own, and the barge-in gets exactly one answer.
id: s12-barge-in
plan: S12
title: Barge-in while the agent is talking
tags: [audio, core, flow:barge-in, template:barbershop]
lang: en
windowMs: 60000
jitterMs: 23
caller:
  - waitAgentIdle: 600
  - say: "Hi, are you still open right now?"
  - waitAgentPlaying: 1500
  - say: "Actually, can I just book a fade for Friday at nine?"
  - waitAgentIdle: 800
  - hangup: true
agent:
  replies:
    - say: "Sure, let me check the time at the shop for you, one second."
      tool: { name: scheduling_list_services }
      afterTool: "Yes, we're open until six today."
    - say: "Of course. Friday at nine for a fade. Can I get your first name?"
db:
  # The lookup is slow (its catalog query takes 2.5 s), so its result comes
  # back while the caller is still talking over the agent.
  slow:
    - { match: "FROM scheduling_appointment_types", latencyMs: 2500 }
expect:
  utterances: 2
  endedBy: caller
  bargeIn: { clearWithinMs: 300, staleAudioMs: 0, answers: 1 }
  lateToolResultDropped: true
  bookings: 0
